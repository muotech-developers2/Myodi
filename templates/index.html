<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Game Odds Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container py-4">
        <div class="card shadow-lg border-0 analysis-panel">
            <div class="card-body p-4">
                <h1 class="page-title text-center mb-4">VIRTUAL GAME ODDS ANALYZER</h1>

                <form id="upload-form" method="post" enctype="multipart/form-data">
                    <div class="row g-3 align-items-end justify-content-center">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Upload Screenshot</label>
                            <input class="form-control" type="file" name="file" id="file-input" accept=".jpg,.jpeg,.png,.webp" required>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary w-100" type="submit" id="analyze-btn">Analyze Image</button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-outline-secondary w-100" type="button" id="clear-btn">Clear Results</button>
                        </div>
                    </div>
                </form>

                <div id="loading" class="mt-4 d-none text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 mb-0 text-primary fw-semibold">Processing screenshot with OCR...</p>
                </div>

                {% if error %}
                <div class="alert alert-danger mt-4">{{ error }}</div>
                {% endif %}

                {% if file_name %}
                <div class="mt-4">
                    <h5 class="mb-3">Uploaded Image Preview</h5>
                    <img src="{{ url_for('static', filename='uploads/' + file_name) if false else '' }}" alt="Uploaded preview" class="img-fluid preview-image d-none" id="preview-image">
                </div>
                {% endif %}

                <div id="results-section" class="mt-4 d-none">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h2 class="h4 mb-0">RESULTS</h2>
                        <div class="btn-group">
                            <button class="btn btn-success" type="button" id="recalculate-btn">Recalculate</button>
                            <button class="btn btn-outline-dark" type="button" id="export-csv-btn">Export CSV</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle results-table">
                            <thead>
                                <tr>
                                    <th>Match</th>
                                    <th>1</th>
                                    <th>X</th>
                                    <th>2</th>
                                    <th>YES</th>
                                    <th>NO</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="results-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
